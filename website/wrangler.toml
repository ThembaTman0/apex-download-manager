# Cloudflare Pages config for the Apex Download Manager site + stats API.
# The site is a Vite + React app; Functions live in ./functions and are
# picked up automatically because this file sits next to them.
#
# One-time setup:
#   1. cd website
#   2. npm install
#   3. npx wrangler kv namespace create STATS
#      -> copy the returned "id" into the binding below
#   4. npm run deploy   (builds to dist/, then wrangler pages deploy)
#   (or connect the repo in the Cloudflare dashboard with build command
#   "npm run build", output "dist", and set the same KV binding there under
#   Pages > Settings > Functions > KV namespace bindings)

name = "apex-download-manager"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-08"

[[kv_namespaces]]
binding = "STATS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
