# Temporary diagnostic: verifies what RELEASES_TOKEN can actually do
# against the public releases repo. Safe to delete once releases work.
name: Token check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check RELEASES_TOKEN permissions on releases repo
        env:
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          echo "token present: $([ -n "$TOKEN" ] && echo yes || echo no)"
          echo "token prefix: $(printf '%s' "$TOKEN" | cut -c1-11)..."
          echo "--- repo access ---"
          curl -s -H "Authorization: Bearer $TOKEN" -H "User-Agent: check" \
            https://api.github.com/repos/ThembaTman0/apex-download-manager-releases \
            | jq '{full_name, permissions, message}'
          echo "--- token identity ---"
          curl -s -H "Authorization: Bearer $TOKEN" -H "User-Agent: check" \
            https://api.github.com/user | jq '{login, message}'
          echo "--- can it create a release? (draft, deleted immediately) ---"
          resp=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" -H "User-Agent: check" \
            https://api.github.com/repos/ThembaTman0/apex-download-manager-releases/releases \
            -d '{"tag_name":"diag-tmp","name":"diagnostic","draft":true}')
          code=$(echo "$resp" | tail -1)
          echo "create-release HTTP: $code"
          if [ "$code" = "201" ]; then
            rid=$(echo "$resp" | head -n -1 | jq .id)
            curl -s -X DELETE -H "Authorization: Bearer $TOKEN" -H "User-Agent: check" \
              "https://api.github.com/repos/ThembaTman0/apex-download-manager-releases/releases/$rid" \
              -o /dev/null -w "cleanup delete HTTP: %{http_code}\n"
          fi
