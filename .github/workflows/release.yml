# Builds the Windows installer + updater artifacts and publishes a GitHub
# Release whenever a v* tag is pushed. The release includes latest.json,
# which the in-app updater polls.
#
# This source repo is PRIVATE, so releases are published to the separate
# PUBLIC repo apex-download-manager-releases - the website's /dl redirect
# and the in-app updater both need anonymous access to the assets.
#
# Pushing the tag is the whole release procedure. This workflow creates the
# release in the public repo itself, so there is no manual pre-create step
# any more. What is still done by hand, before tagging: bump the version in
# tauri.conf.json AND src-tauri/Cargo.toml, and rewrite RELEASE_NOTES.md
# (its first line is the teaser in the app's update toast). The workflow
# refuses to build if the tag and those two files disagree.
#
# Required repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY - contents of ~/.tauri/apex-updater-v2.key
#   (TAURI_SIGNING_PRIVATE_KEY_PASSWORD too, if the key has a password;
#   the current key has none, so that secret does not exist)
#   RELEASES_TOKEN - PAT with "Contents: read and write" on the public
#   releases repo, used both to create the release and to upload the assets
#   (the default GITHUB_TOKEN cannot write to another repo)
#
# Optional:
#   WINGET_TOKEN - CLASSIC PAT with the public_repo scope, for the winget
#   step (komac forks microsoft/winget-pkgs and opens the PR from that fork;
#   fine-grained tokens cannot open that PR). Unset = step is skipped.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-ui/src-tauri

      - name: Install frontend dependencies
        working-directory: desktop-ui
        run: npm ci

      # Guard against the mistake this repo has actually made: tagging without
      # bumping. Both version files must agree with the tag or nothing runs.
      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $conf = (Get-Content desktop-ui/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = ([regex]::Match((Get-Content desktop-ui/src-tauri/Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"')).Groups[1].Value
          "tag=$tag  tauri.conf.json=$conf  Cargo.toml=$cargo"
          if ($conf -ne $tag -or $cargo -ne $tag) {
            throw "Version mismatch. Tag says $tag, tauri.conf.json says $conf, Cargo.toml says $cargo. Bump both files, then move the tag."
          }
          if (-not (Test-Path RELEASE_NOTES.md) -or -not (Get-Content RELEASE_NOTES.md -Raw).Trim()) {
            throw "RELEASE_NOTES.md is missing or empty. It becomes both the release body and the updater teaser."
          }

      # RELEASE_NOTES.md becomes the release body AND latest.json `notes`
      # (tauri-action copies its releaseBody input into the updater JSON -
      # the pre-created release's body is NOT used for that). The app shows
      # the first content line of `notes` as a teaser in the update toast.
      - name: Read release notes
        id: notes
        shell: pwsh
        run: |
          "body<<NOTES_EOF" >> $env:GITHUB_OUTPUT
          Get-Content RELEASE_NOTES.md -Raw >> $env:GITHUB_OUTPUT
          "NOTES_EOF" >> $env:GITHUB_OUTPUT

      # tauri-action cannot create the release itself: it sends this repo's
      # commit SHA as target_commitish, that SHA does not exist in the releases
      # repo, and the API answers 422. Creating the release here first reduces
      # tauri-action's job to uploading assets, which is the one thing it does
      # reliably across repos. This used to be a manual web-UI step before
      # every tag; it is idempotent, so re-running a failed build is safe.
      - name: Ensure the release exists in the public repo
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          $repo = "ThembaTman0/apex-download-manager-releases"
          $tag = "${{ github.ref_name }}"
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            "Release $tag already exists in $repo, leaving it as is."
          } else {
            "Creating release $tag in $repo."
            gh release create $tag --repo $repo --target main `
              --title "Apex Download Manager $tag" --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create release $tag in $repo. Check that RELEASES_TOKEN still has Contents: read and write there."
            }
          }

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop-ui
          owner: ThembaTman0
          repo: apex-download-manager-releases
          tagName: ${{ github.ref_name }}
          releaseName: "Apex Download Manager ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false

      # Opens a PR to microsoft/winget-pkgs adding this version, generated by
      # komac from the previous version's manifest there. `komac update` only
      # works once the package exists in winget-pkgs; the first version was
      # submitted by hand from winget/ in this repo. Skipped while WINGET_TOKEN
      # is unset. The release is already published by this point, so a winget
      # hiccup warns instead of failing the build.
      - name: Submit the new version to winget
        continue-on-error: true
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            "::notice::WINGET_TOKEN is not set, skipping the winget submission."
            exit 0
          }
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $url = "https://github.com/ThembaTman0/apex-download-manager-releases/releases/download/$tag/Apex.Download.Manager_${version}_x64-setup.exe"

          # Pinned and checksum-verified: this binary handles a token that can
          # push to a public fork, so it is not fetched as "latest".
          $komac = "2.16.0"
          $exe = "komac-$komac-x86_64-pc-windows-msvc.exe"
          $base = "https://github.com/russellbanks/Komac/releases/download/v$komac"
          Invoke-WebRequest "$base/$exe" -OutFile komac.exe
          Invoke-WebRequest "$base/SHA256SUMS" -OutFile komac.sums
          $line = Get-Content komac.sums | Where-Object { $_ -match "\*$([regex]::Escape($exe))$" }
          $expected = ($line -split '\s+')[0]
          $actual = (Get-FileHash komac.exe -Algorithm SHA256).Hash
          if (-not $expected -or $actual -ne $expected) {
            throw "komac.exe checksum mismatch (expected '$expected', got '$actual'). Not submitting."
          }

          .\komac.exe update ThembaTman0.ApexDownloadManager --version $version --urls $url --submit --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) {
            throw "komac could not submit $version to winget-pkgs. Check that WINGET_TOKEN is a classic PAT with public_repo."
          }
