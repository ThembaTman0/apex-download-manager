# Builds the Windows installer + updater artifacts and publishes a GitHub
# Release whenever a v* tag is pushed. The release includes latest.json,
# which the in-app updater polls.
#
# Releases are published to the separate repo apex-download-manager-releases,
# not this one. That split dates from when this repo was private, and it
# stays: every installed copy polls that repo's latest.json for updates, and
# the website's /dl redirect, stats and changelog read from it too.
#
# Pushing the tag is the whole release procedure. This workflow creates the
# release in the public repo itself, so there is no manual pre-create step
# any more. What is still done by hand, before tagging: bump the version in
# tauri.conf.json AND src-tauri/Cargo.toml, and rewrite RELEASE_NOTES.md
# (its first line is the teaser in the app's update toast). The workflow
# refuses to build if the tag and those two files disagree.
#
# Required repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY - contents of ~/.tauri/apex-updater-v2.key
#   (TAURI_SIGNING_PRIVATE_KEY_PASSWORD too, if the key has a password;
#   the current key has none, so that secret does not exist)
#   RELEASES_TOKEN - PAT with "Contents: read and write" on the public
#   releases repo, used both to create the release and to upload the assets
#   (the default GITHUB_TOKEN cannot write to another repo)
#
# Optional:
#   WINGET_TOKEN - CLASSIC PAT with the public_repo and workflow scopes, for
#   the winget step (komac forks microsoft/winget-pkgs and opens the PR from
#   that fork; fine-grained tokens cannot open that PR). Unset = step is
#   skipped. Without workflow, the submission fails with a `CreateRef`
#   permissions error whenever the fork is behind upstream and upstream has
#   changed its workflow files (this broke 1.1.1). Manual fallback: run
#   `gh repo sync ThembaTman0/winget-pkgs`, then re-run this workflow by hand
#   with the tag.
#   CHOCO_API_KEY - API key from community.chocolatey.org (Account > API
#   Keys), for the Chocolatey push. Unset = step is skipped.
#
# The Scoop bump needs no secret: it commits to this repo's main branch
# with the workflow's own token (the job has contents: write).
name: Release

on:
  push:
    tags:
      - "v*"
  # Manual re-run of the winget submission only (Actions > Release > Run
  # workflow), for when the automatic one failed. Builds and publishes nothing.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to submit to winget, e.g. v1.1.1"
        required: true

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write
      # Build provenance: a Sigstore-signed statement, stored on this repo,
      # that each installer was built by this workflow from this commit.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop-ui/src-tauri

      - name: Install frontend dependencies
        working-directory: desktop-ui
        run: npm ci

      # Guard against the mistake this repo has actually made: tagging without
      # bumping. Both version files must agree with the tag or nothing runs.
      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $conf = (Get-Content desktop-ui/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = ([regex]::Match((Get-Content desktop-ui/src-tauri/Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"')).Groups[1].Value
          "tag=$tag  tauri.conf.json=$conf  Cargo.toml=$cargo"
          if ($conf -ne $tag -or $cargo -ne $tag) {
            throw "Version mismatch. Tag says $tag, tauri.conf.json says $conf, Cargo.toml says $cargo. Bump both files, then move the tag."
          }
          if (-not (Test-Path RELEASE_NOTES.md) -or -not (Get-Content RELEASE_NOTES.md -Raw).Trim()) {
            throw "RELEASE_NOTES.md is missing or empty. It becomes both the release body and the updater teaser."
          }

      # RELEASE_NOTES.md becomes the release body AND latest.json `notes`
      # (tauri-action copies its releaseBody input into the updater JSON -
      # the pre-created release's body is NOT used for that). The app shows
      # the first content line of `notes` as a teaser in the update toast.
      - name: Read release notes
        id: notes
        shell: pwsh
        run: |
          "body<<NOTES_EOF" >> $env:GITHUB_OUTPUT
          Get-Content RELEASE_NOTES.md -Raw >> $env:GITHUB_OUTPUT
          "NOTES_EOF" >> $env:GITHUB_OUTPUT

      # tauri-action cannot create the release itself: it sends this repo's
      # commit SHA as target_commitish, that SHA does not exist in the releases
      # repo, and the API answers 422. Creating the release here first reduces
      # tauri-action's job to uploading assets, which is the one thing it does
      # reliably across repos. This used to be a manual web-UI step before
      # every tag; it is idempotent, so re-running a failed build is safe.
      - name: Ensure the release exists in the public repo
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          $repo = "ThembaTman0/apex-download-manager-releases"
          $tag = "${{ github.ref_name }}"
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            "Release $tag already exists in $repo, leaving it as is."
          } else {
            "Creating release $tag in $repo."
            gh release create $tag --repo $repo --target main `
              --title "Apex Download Manager $tag" --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create release $tag in $repo. Check that RELEASES_TOKEN still has Contents: read and write there."
            }
          }

      - name: Build and publish release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop-ui
          owner: ThembaTman0
          repo: apex-download-manager-releases
          tagName: ${{ github.ref_name }}
          releaseName: "Apex Download Manager ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false

      # Portable build: the same exe tauri-action just built, plus a
      # `portable` marker that makes Apex keep its data in a `data` folder
      # beside it and turns the updater off. Tauri links the WebView2 loader
      # statically, so the exe needs nothing else (WebView2 itself ships with
      # Windows 10/11). Not referenced by latest.json, so the updater and
      # the website's /dl never pick it up.
      - name: Build and upload the portable zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $exe = "desktop-ui/src-tauri/target/release/apex-download-manager.exe"
          if (-not (Test-Path $exe)) { throw "The release exe is missing at $exe." }
          $stage = Join-Path $env:RUNNER_TEMP "portable/Apex Download Manager"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item $exe (Join-Path $stage "Apex Download Manager.exe")
          New-Item -ItemType File (Join-Path $stage "portable") | Out-Null
          Set-Content -Encoding utf8 (Join-Path $stage "README.txt") @(
            "Apex Download Manager $version, portable edition",
            "",
            "Run 'Apex Download Manager.exe'. Your downloads list, settings and tools",
            "are kept in the 'data' folder next to it, so the whole folder can live on",
            "a USB drive. Deleting the 'portable' file switches back to normal mode.",
            "",
            "Updates are manual: download the new zip and copy its exe over this one.",
            "Your data folder is kept.",
            "",
            "Requires Windows 10 or 11 (x64) with WebView2, which Windows includes."
          )
          $zip = Join-Path $env:RUNNER_TEMP "Apex.Download.Manager_${version}_x64_portable.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          gh release upload $tag $zip --clobber --repo ThembaTman0/apex-download-manager-releases
          if ($LASTEXITCODE -ne 0) { throw "Could not upload the portable zip to $tag." }

      # Anyone can check a download with:
      #   gh attestation verify <file> --repo ThembaTman0/apex-download-manager
      # The release is already public by now, so a hiccup here warns instead
      # of failing it.
      - name: Attest build provenance (Windows)
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            desktop-ui/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop-ui/src-tauri/target/release/bundle/msi/*.msi
            ${{ runner.temp }}/Apex.Download.Manager_*_portable.zip

      - name: Upload SHA256SUMS (Windows)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @(
            Get-ChildItem desktop-ui/src-tauri/target/release/bundle/nsis/*-setup.exe
            Get-ChildItem desktop-ui/src-tauri/target/release/bundle/msi/*.msi
            Get-ChildItem "$env:RUNNER_TEMP/Apex.Download.Manager_*_portable.zip"
          )
          # GitHub turns spaces in asset names into dots; list the names
          # people actually download so `sha256sum -c` style checks match.
          $lines = $files | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name -replace ' ', '.')"
          }
          $sums = Join-Path $env:RUNNER_TEMP "SHA256SUMS-windows.txt"
          [IO.File]::WriteAllText($sums, ($lines -join "`n") + "`n")
          Get-Content $sums
          gh release upload $tag $sums --clobber --repo ThembaTman0/apex-download-manager-releases
          if ($LASTEXITCODE -ne 0) { throw "Could not upload SHA256SUMS-windows.txt to $tag." }

      # Mirrors the installers onto this repo's own Releases page. Visitors
      # land here (README, Reddit, HN), and with an empty Releases sidebar
      # they assumed they had to build from source. Installers only:
      # latest.json and the .sig files stay in the releases repo, which is
      # what the updater polls. Idempotent; a failure never fails the release.
      - name: Mirror the installers to this repo's Releases
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $dir = Join-Path $env:RUNNER_TEMP "mirror"
          New-Item -ItemType Directory -Force $dir | Out-Null
          gh release download $tag --repo ThembaTman0/apex-download-manager-releases `
            --dir $dir --pattern "*-setup.exe" --pattern "*.msi" --pattern "*_portable.zip" --pattern "SHA256SUMS-windows.txt"
          if ($LASTEXITCODE -ne 0) { throw "Could not download the $tag installers from the releases repo." }
          $files = (Get-ChildItem $dir).FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --verify-tag `
              --title "Apex Download Manager $tag" --notes-file RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish $tag on this repo's Releases page." }

      # Bumps bucket/apex-download-manager.json on main so `scoop update`
      # sees the new version. Runs before anything edits tracked files: the
      # build leaves the tree clean, which lets it switch to main. Text
      # replacements, not a JSON round-trip, to keep the file's formatting.
      - name: Bump the Scoop manifest
        continue-on-error: true
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $msi = Get-ChildItem desktop-ui/src-tauri/target/release/bundle/msi -Filter "*_${version}_x64_en-US.msi" | Select-Object -First 1
          if (-not $msi) { throw "Built MSI for $version not found." }
          $hash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower()
          $url = "https://github.com/ThembaTman0/apex-download-manager-releases/releases/download/$tag/Apex.Download.Manager_${version}_x64_en-US.msi"

          git fetch --depth 1 origin main:refs/remotes/origin/main
          git switch -c scoop-bump origin/main
          $f = "bucket/apex-download-manager.json"
          $text = Get-Content $f -Raw
          $text = $text -replace '(?m)^(    "version": ")[^"]+"', "`${1}$version`""
          $text = $text -replace '"url": "https://[^"]+/download/v\d[^"]*"', "`"url`": `"$url`""
          $text = $text -replace '"hash": "[0-9a-f]{64}"', "`"hash`": `"$hash`""
          Set-Content $f $text -NoNewline
          if (-not (git status --porcelain $f)) { "Scoop manifest already at $version."; exit 0 }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(scoop): bump apex-download-manager to $version" -- $f
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Could not push the Scoop bump to main." }

      # Packs and pushes this version to the Chocolatey community repository,
      # from packaging/chocolatey with the version, URL and checksum filled in
      # (the edits stay in this runner; the repo keeps the hand-submitted
      # values). Chocolatey refuses a push while an earlier version is still
      # in moderation, so the first hand-submitted package must be approved
      # first. Skipped while CHOCO_API_KEY is unset; never fails the release.
      - name: Push the new version to Chocolatey
        continue-on-error: true
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          if (-not $env:CHOCO_API_KEY) {
            "::notice::CHOCO_API_KEY is not set, skipping the Chocolatey push."
            exit 0
          }
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $msi = Get-ChildItem desktop-ui/src-tauri/target/release/bundle/msi -Filter "*_${version}_x64_en-US.msi" | Select-Object -First 1
          if (-not $msi) { throw "Built MSI for $version not found." }
          $hash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower()
          $url = "https://github.com/ThembaTman0/apex-download-manager-releases/releases/download/$tag/Apex.Download.Manager_${version}_x64_en-US.msi"

          $nuspec = "packaging/chocolatey/apex-download-manager.nuspec"
          $install = "packaging/chocolatey/tools/chocolateyinstall.ps1"
          $n = Get-Content $nuspec -Raw
          $n = $n -replace '<version>[^<]+</version>', "<version>$version</version>"
          $n = $n -replace '(releases/tag/)v[^<]+', "`${1}$tag"
          Set-Content $nuspec $n -NoNewline
          $i = Get-Content $install -Raw
          $i = $i -replace "(url64bit\s*=\s*)'[^']+'", "`${1}'$url'"
          $i = $i -replace "(checksum64\s*=\s*)'[^']+'", "`${1}'$hash'"
          Set-Content $install $i -NoNewline

          choco pack $nuspec --outputdirectory $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "choco pack failed." }
          choco push "$env:RUNNER_TEMP/apex-download-manager.$version.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
          if ($LASTEXITCODE -ne 0) {
            throw "choco push failed. If an earlier version is still in moderation, push this one by hand once it is approved."
          }

      # The winget submission is its own job (`winget`, below) so it can be
      # re-run by hand without rebuilding anything.

      # The website bakes the current version, size and SHA-256 into its HTML
      # and its structured data at build time, and it only builds when the
      # site repo is pushed. Without this, a release ships and the page keeps
      # advertising the previous one to crawlers and to anyone with scripting
      # off until the next unrelated commit.
      #
      # Optional, like the winget and Chocolatey steps: create a Deploy Hook
      # in the Vercel project (Settings > Git > Deploy Hooks) and store the
      # URL as VERCEL_DEPLOY_HOOK. Never fatal, because a stale page is not a
      # reason to fail a release that already published.
      - name: Rebuild the website so it advertises this version
        continue-on-error: true
        shell: pwsh
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if (-not $env:VERCEL_DEPLOY_HOOK) {
            "::notice::VERCEL_DEPLOY_HOOK is not set, skipping the site rebuild."
            exit 0
          }
          Invoke-RestMethod -Method Post -Uri $env:VERCEL_DEPLOY_HOOK | Out-Null
          "::notice::Asked Vercel to rebuild the site for ${{ github.ref_name }}."

  # AppImage + .deb, uploaded to the same release after the Windows job has
  # created it. tauri-action finds the latest.json already there and adds the
  # linux-x86_64 entry (the AppImage) next to the Windows ones. Only the
  # AppImage updates itself; .deb and distro installs are told to use their
  # package manager (commands::updater_enabled). Built on 22.04 so the
  # AppImage runs on older glibc too.
  linux:
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop-ui/src-tauri

      - name: Install frontend dependencies
        working-directory: desktop-ui
        run: npm ci

      # Same notes as the Windows job: tauri-action writes releaseBody into
      # latest.json `notes` when it merges, so leaving it out would blank the
      # update toast's teaser for everyone.
      - name: Read release notes
        id: notes
        run: |
          {
            echo "body<<NOTES_EOF"
            cat RELEASE_NOTES.md
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and upload the Linux packages
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop-ui
          owner: ThembaTman0
          repo: apex-download-manager-releases
          tagName: ${{ github.ref_name }}
          releaseName: "Apex Download Manager ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --bundles appimage,deb

      - name: Attest build provenance (Linux)
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            desktop-ui/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop-ui/src-tauri/target/release/bundle/deb/*.deb

      - name: Upload SHA256SUMS (Linux)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          cd desktop-ui/src-tauri/target/release/bundle
          sums="$RUNNER_TEMP/SHA256SUMS-linux.txt"
          for f in appimage/*.AppImage deb/*.deb; do
            printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f" | tr ' ' '.')"
          done > "$sums"
          cat "$sums"
          gh release upload "$GITHUB_REF_NAME" "$sums" --clobber \
            --repo ThembaTman0/apex-download-manager-releases

  # Opens a PR to microsoft/winget-pkgs adding this version, generated by
  # komac from the previous version's manifest there. `komac update` only
  # works once the package exists in winget-pkgs; the first version was
  # submitted by hand from winget/ in this repo. Skipped while WINGET_TOKEN
  # is unset. Runs after the Windows job on a tag push, or alone from a manual
  # run (workflow_dispatch with a tag). The release is already published by
  # then, so a winget hiccup warns instead of failing the build.
  winget:
    needs: release
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: windows-latest
    permissions: {}
    steps:
      - name: Submit the new version to winget
        continue-on-error: ${{ github.event_name == 'push' }}
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            "::notice::WINGET_TOKEN is not set, skipping the winget submission."
            exit 0
          }
          $tag = $env:TAG.Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "'$tag' is not a release tag like v1.1.1."
          }
          $version = $tag -replace '^v', ''
          $url = "https://github.com/ThembaTman0/apex-download-manager-releases/releases/download/$tag/Apex.Download.Manager_${version}_x64-setup.exe"

          # Pinned and checksum-verified: this binary handles a token that can
          # push to a public fork, so it is not fetched as "latest".
          $komac = "2.16.0"
          $exe = "komac-$komac-x86_64-pc-windows-msvc.exe"
          $base = "https://github.com/russellbanks/Komac/releases/download/v$komac"
          Invoke-WebRequest "$base/$exe" -OutFile komac.exe
          Invoke-WebRequest "$base/SHA256SUMS" -OutFile komac.sums
          $line = Get-Content komac.sums | Where-Object { $_ -match "\*$([regex]::Escape($exe))$" }
          $expected = ($line -split '\s+')[0]
          $actual = (Get-FileHash komac.exe -Algorithm SHA256).Hash
          if (-not $expected -or $actual -ne $expected) {
            throw "komac.exe checksum mismatch (expected '$expected', got '$actual'). Not submitting."
          }

          # komac branches from the fork's default branch; once the fork falls
          # thousands of commits behind upstream, creating that branch fails
          # with CreateRef. Sync it first (needs the workflow scope, because
          # upstream commits touch .github/workflows). Non-fatal: komac may
          # still succeed if the fork is only slightly behind.
          $env:GH_TOKEN = $env:WINGET_TOKEN
          gh repo sync ThembaTman0/winget-pkgs --branch master
          if ($LASTEXITCODE -ne 0) { "::warning::Could not sync the winget-pkgs fork; trying komac anyway." }

          .\komac.exe update ThembaTman0.ApexDownloadManager --version $version --urls $url --submit --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) {
            throw "komac could not submit $version to winget-pkgs. Check that WINGET_TOKEN is a classic PAT with the public_repo and workflow scopes and has not expired. If the error mentions CreateRef, the fork is behind upstream: run 'gh repo sync ThembaTman0/winget-pkgs', then re-run this workflow by hand with the tag."
          }
