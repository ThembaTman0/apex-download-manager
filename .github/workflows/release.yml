# Builds the Windows installer + updater artifacts and publishes a GitHub
# Release whenever a v* tag is pushed. The release includes latest.json,
# which the in-app updater polls.
#
# This source repo is PRIVATE, so releases are published to the separate
# PUBLIC repo apex-download-manager-releases — the website's /dl redirect
# and the in-app updater both need anonymous access to the assets.
#
# Required repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY — contents of ~/.tauri/apex-updater.key
#   (TAURI_SIGNING_PRIVATE_KEY_PASSWORD too, if the key has a password)
#   RELEASES_TOKEN — fine-grained PAT with "Contents: read and write" on
#   the public releases repo (the default GITHUB_TOKEN can't write there)
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-ui/src-tauri

      - name: Install frontend dependencies
        working-directory: desktop-ui
        run: npm ci

      # RELEASE_NOTES.md becomes the release body AND latest.json `notes`
      # (tauri-action copies its releaseBody input into the updater JSON —
      # the pre-created release's body is NOT used for that). The app shows
      # the first content line of `notes` as a teaser in the update toast.
      - name: Read release notes
        id: notes
        shell: pwsh
        run: |
          "body<<NOTES_EOF" >> $env:GITHUB_OUTPUT
          Get-Content RELEASE_NOTES.md -Raw >> $env:GITHUB_OUTPUT
          "NOTES_EOF" >> $env:GITHUB_OUTPUT

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop-ui
          owner: ThembaTman0
          repo: apex-download-manager-releases
          tagName: ${{ github.ref_name }}
          releaseName: "Apex Download Manager ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
