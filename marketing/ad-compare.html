<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:675px; overflow:hidden; }
  body {
    background:#08090a; color:#f7f8f8;
    font-family:"Inter","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; justify-content:center;
    padding:0 110px; position:relative;
  }
  .glow { position:absolute; width:900px; height:900px; border-radius:50%;
    background:radial-gradient(circle, rgba(230,180,80,0.08) 0%, transparent 60%);
    top:-400px; left:-250px; }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:40px; }
  .mark { width:40px; height:40px; border-radius:10px; background:#000;
    border:1px solid rgba(255,255,255,0.14);
    display:flex; align-items:center; justify-content:center; }
  .mark svg { width:20px; height:20px; }
  .brand span { font-size:18px; font-weight:600; }
  h1 { font-size:58px; font-weight:700; letter-spacing:-0.03em; line-height:1.06;
    margin-bottom:52px; }
  .lane { margin-bottom:34px; }
  .lane-head { display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:12px; }
  .lane-name { font-size:21px; color:#8a8f98; }
  .lane-speed { font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; }
  .lane-speed.slow { color:#5b5f66; }
  .lane-speed.fast { color:#e6b450; }
  .track { height:14px; background:rgba(255,255,255,0.05); border-radius:7px; overflow:hidden; }
  .track .fill { height:100%; border-radius:7px; }
  .fill.grey { width:12%; background:#3a3d42; }
  .fill.amber { width:88%; background:linear-gradient(90deg,#c99b3f,#e6b450); }
  .foot { margin-top:26px; display:flex; align-items:center; gap:26px; }
  .cta { background:#f7f8f8; color:#08090a; font-weight:600; font-size:20px;
    padding:15px 32px; border-radius:9px; }
  .url { font-size:19px; color:#5b5f66; }
</style></head><body>
  <div class="glow"></div>
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3 L20 21 L15.5 21 L12 12.5 L8.5 21 L4 21 Z" fill="#fff"/></svg></div>
    <span>Apex Download Manager</span>
  </div>
  <h1>Same file. Same network.<br>One uses all of it.</h1>
  <div class="lane">
    <div class="lane-head"><span class="lane-name">Browser download · 1 connection</span><span class="lane-speed slow">4.8 MB/s</span></div>
    <div class="track"><div class="fill grey"></div></div>
  </div>
  <div class="lane">
    <div class="lane-head"><span class="lane-name">Apex · up to 32 connections</span><span class="lane-speed fast">41.9 MB/s</span></div>
    <div class="track"><div class="fill amber"></div></div>
  </div>
  <div class="foot">
    <div class="cta">Download free for Windows</div>
    <div class="url">apexdownloadmanager.com</div>
  </div>
</body></html>
